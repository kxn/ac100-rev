# uac profile (UCI "profile" config) — reconstruction.
#
# EVIDENCE: uac hard-fails without this data (cw_ac_profile_init @0x58dca4
# returns -1 on any read failure → "Init uac process failed, exit…").
# The real file lives in the device's flash config partition (NOT in the
# shipped firmware image; /etc/config → /tmp/etc/uc_conf). Sections/options
# below are the exact keys read via uac_profile_get_int/get_string
# (embedded Lua "uci_r:get_profile(section, option)", strings in .rodata).
# Values marked (recon) are placeholders pending calibration against a live
# device (`uci show profile`); values marked (fixture) match behavior seen
# in the vendor's own .data fixtures.
[ac_capwap]
frag_enable = 1
frag_mtu = 1400
session_num = 64
pkt_queue_size = 256
mngr_queue_size = 256
timer_size = 256
timer_max_time = 60
timer_process_num = 1
mngr_process_num = 1
pkt_process_num = 1
thread_size = 1
cacert_file_path = /etc/cacert.pem
privkey_file_path = /etc/privkey.pem
socket_recv_buffer_size = 262144
socket_send_buffer_size = 262144
default_retransmit_time = 3
retransmit_max_retries = 5
max_session_num = 64
max_pkt_snapshot_mem_size = 2097152
