<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>无线控制器</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/mesh.js" defer></script>
    <script src="/management.js" defer></script>
    <script src="/rates.js" defer></script>
    <script src="/mobility.js" defer></script>
    <script src="/multicast.js" defer></script>
    <script src="/edca.js" defer></script>
    <script src="/rrm.js" defer></script>
    <script src="/history.js" defer></script>
    <script src="/protection.js" defer></script>
    <script src="/upgrade.js" defer></script>
    <script src="/resources.js" defer></script>
    <script src="/navigation.js" defer></script>
    <script src="/views.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
    <aside id="sidebar" aria-label="侧边栏">
      <a class="brand" href="#overview">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0" />
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
            <circle cx="12" cy="19.5" r="1" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-text">无线控制器</span>
      </a>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="aside-bottom">
        <div class="aside-status">
          <span id="connection-dot" class="connection-dot"></span>
          <span id="connection">连接中</span>
        </div>
        <div class="aside-meta">
          <span id="sync" class="num"></span>
          <button id="refresh" class="icon-btn" type="button" aria-label="刷新状态" title="刷新状态">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <polyline points="21 3 21 9 15 9" />
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menu-toggle" class="icon-btn mobile-only" type="button" aria-label="打开菜单">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <h1 id="title">概览</h1>
        </div>
        <div class="topbar-right">
          <button id="sync-alert" class="sync-alert hidden" type="button"></button>
          <div id="header-actions" class="header-actions"></div>
        </div>
      </header>
      <div id="section-navigation" class="subnav-wrap hidden"></div>
      <main>
        <section id="content" aria-live="polite"></section>
      </main>
    </div>

    <dialog id="drawer" class="drawer">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <h2 id="drawer-title"></h2>
          <p id="drawer-subtitle" class="drawer-subtitle"></p>
        </div>
        <button class="icon-btn" id="close-drawer" type="button" aria-label="关闭">×</button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </dialog>

    <dialog id="editor" class="modal">
      <div class="dialog-header">
        <div>
          <h2 id="dialog-title"></h2>
          <p id="dialog-subtitle" class="dialog-subtitle"></p>
        </div>
        <button class="icon-btn" id="close-dialog" type="button" aria-label="关闭">×</button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
    </dialog>

    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
