<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>无线控制器</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/mesh.js" defer></script>
    <script src="/management.js" defer></script>
    <script src="/rates.js" defer></script>
    <script src="/mobility.js" defer></script>
    <script src="/multicast.js" defer></script>
    <script src="/edca.js" defer></script>
    <script src="/rrm.js" defer></script>
    <script src="/history.js" defer></script>
    <script src="/protection.js" defer></script>
    <script src="/upgrade.js" defer></script>
    <script src="/resources.js" defer></script>
    <script src="/navigation.js" defer></script>
    <script src="/views.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside>
      <a class="brand" href="#overview"
        ><span class="brand-icon">W</span
        ><span>无线控制器<small>集中管理你的无线网络</small></span></a
      >
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="aside-bottom">
        <span class="connection-dot"></span
        ><span id="connection">连接控制器中</span>
      </div>
    </aside>
    <div class="workspace">
      <header>
        <div>
          <span class="subtle">无线控制器</span><span class="separator">/</span
          ><strong id="breadcrumb">总览</strong>
        </div>
        <span id="sync">正在读取设备上报…</span>
      </header>
      <main>
        <div class="page-title">
          <div>
            <h1 id="title">总览</h1>
            <p id="description"></p>
          </div>
          <div class="actions">
            <button class="secondary" id="refresh">刷新状态</button
            ><button class="primary hidden" id="new-service">
              新建无线服务
            </button>
          </div>
        </div>
        <div class="stats" id="summary">
          <div>
            <span>在线 AP <span class="metric-icon">AP</span></span
            ><strong id="online">—</strong
            ><small id="total-ap">等待设备上报</small>
          </div>
          <div>
            <span>在线客户端 <span class="metric-icon">STA</span></span
            ><strong id="client-count">—</strong
            ><small>以 AP 最近上报的连接状态为准</small>
          </div>
          <div>
            <span>启用的无线服务 <span class="metric-icon">WLAN</span></span
            ><strong id="service-count">—</strong
            ><small id="service-summary">读取已保存的服务配置</small>
          </div>
          <div>
            <span>配置同步 <span class="metric-icon">SYNC</span></span
            ><strong id="pending-count">—</strong
            ><small id="apply-summary">等待设备应答</small>
          </div>
        </div>
        <div id="section-navigation"></div>
        <section id="content" aria-live="polite"></section>
      </main>
      <footer>
        <span>无线网络 · 本地集中管理</span
        ><span id="footer-status">运行状态来自 AP 实际上报</span>
      </footer>
    </div>
    <dialog id="editor">
      <div class="dialog-header">
        <div>
          <p id="dialog-caption" class="eyebrow"></p>
          <h2 id="dialog-title"></h2>
        </div>
        <button class="icon-button" id="close-dialog" aria-label="关闭">
          ×
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
