<body><aside><a class="brand" href="#aps"><span class="brand-icon">W</span><span>无线控制器<small>集中管理你的无线网络</small></span></a><div class="nav-label">工作空间</div><nav aria-label="主导航"><button data-tab="aps">AP 管理<span>01</span></button><button data-tab="services">无线服务<span>02</span></button><button data-tab="radios">射频管理<span>03</span></button><button data-tab="clients">无线客户端<span>04</span></button><button data-tab="management">分组与 AP 设置<span>05</span></button><button data-tab="mobility">均衡与漫游<span>06</span></button><button data-tab="history">无线运行记录<span>07</span></button><button data-tab="protection">AP 网络防护<span>08</span></button><button data-tab="upgrades">AP 固件升级<span>09</span></button><button data-tab="interfaces">绑定接口<span>10</span></button></nav><div class="aside-bottom"><span class="connection-dot"></span><span id="connection">连接控制器中</span></div></aside>
<div class="workspace"><header><div><span class="subtle">工作空间</span><span class="separator">/</span><strong id="breadcrumb">AP 管理</strong></div><span id="sync">正在读取设备上报…</span></header><main><div class="page-title"><div><p class="eyebrow">WIRELESS CONTROL</p><h1 id="title">AP 管理</h1><p id="description"></p></div><div class="actions"><button class="secondary" id="refresh">刷新状态</button><button class="primary hidden" id="new-service">新建无线服务</button></div></div>

<section id="content" aria-live="polite"></section></main><footer><span>无线网络 · 本地集中管理</span><span id="footer-status">运行状态来自 AP 实际上报</span></footer></div>
