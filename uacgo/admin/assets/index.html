<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>无线控制器</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/mesh.js" defer></script>
    <script src="/management.js" defer></script>
    <script src="/rates.js" defer></script>
    <script src="/mobility.js" defer></script>
    <script src="/multicast.js" defer></script>
    <script src="/edca.js" defer></script>
    <script src="/rrm.js" defer></script>
    <script src="/history.js" defer></script>
    <script src="/protection.js" defer></script>
    <script src="/upgrade.js" defer></script>
    <script src="/resources.js" defer></script>
    <script src="/ap-dhcp.js" defer></script>
    <script src="/navigation.js" defer></script>
    <script src="/diagnostics.js" defer></script>
    <script src="/views.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="product-header">
      <a class="brand" href="#aps"
        ><span class="brand-mark">AC</span
        ><span
          ><strong>无线控制器</strong><small>独立 Go 控制程序</small></span
        ></a
      >
      <div class="product-actions">
        <button
          id="menu-toggle"
          class="mobile-only"
          type="button"
          aria-label="打开菜单"
        >
          菜单</button
        ><button type="button" data-view="interfaces">程序设置</button>
      </div>
    </header>
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>
    <div class="app-shell">
      <aside id="sidebar" aria-label="功能菜单">
        <nav id="navigation" aria-label="主导航"></nav>
      </aside>
      <div class="workspace">
        <div id="breadcrumb" class="breadcrumb"></div>
        <h1 id="title" class="sr-only">AP状态</h1>
        <div id="section-navigation" class="subnav-wrap"></div>
        <main>
          <div id="header-actions" class="header-actions"></div>
          <button
            id="sync-alert"
            class="sync-alert hidden"
            type="button"
          ></button>
          <section id="content" aria-live="polite"></section>
        </main>
      </div>
    </div>
    <footer class="product-footer">
      <span
        ><span id="connection-dot" class="connection-dot"></span
        ><span id="connection">连接中</span></span
      ><span
        ><span id="sync" class="num"></span
        ><button id="refresh" type="button">刷新状态</button></span
      >
    </footer>

    <dialog id="drawer" class="drawer">
      <div class="drawer-header">
        <div class="drawer-title-group">
          <h2 id="drawer-title"></h2>
          <p id="drawer-subtitle" class="drawer-subtitle"></p>
        </div>
        <button
          class="icon-btn"
          id="close-drawer"
          type="button"
          aria-label="关闭"
        >
          ×
        </button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </dialog>

    <dialog id="editor" class="modal">
      <div class="dialog-header">
        <div>
          <h2 id="dialog-title"></h2>
          <p id="dialog-subtitle" class="dialog-subtitle"></p>
        </div>
        <button
          class="icon-btn"
          id="close-dialog"
          type="button"
          aria-label="关闭"
        >
          ×
        </button>
      </div>
      <div id="dialog-body" class="dialog-body"></div>
    </dialog>

    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
